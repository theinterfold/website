<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" href="/fonts/ABCGramercy-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/OfficeCodePro-Medium.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark-mode.svg" media="(prefers-color-scheme: dark)" />
    <link rel="describedby" href="/llms.txt" type="text/plain" title="The Interfold guide for AI assistants" />

    <!-- interfold:seo:start -->
    <!-- interfold:seo:end -->

    <script
      defer
      src="https://analytics.theinterfold.com/script.js"
      data-website-id="e29d3733-0edb-46fb-bb7f-0902632177ef"
      data-domains="theinterfold.com,www.theinterfold.com"
      data-do-not-track="true"
    ></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      /* min-height, not height: at height:100% the root box is exactly one
         viewport tall however long the page is, and a position:sticky child
         is confined to its own box — so the sticky mobile header stopped
         sticking one screen down and left the network strip pinned to
         nothing. */
      #root {
        min-height: 100%;
      }
    </style>
  </head>

  <body>
    <noscript>
      <style>
        [data-content-reveal],
        .interfold-header-transition a,
        .interfold-header-transition nav > div,
        .interfold-hero-transition img,
        [data-name="Desktop"] > .relative.isolate > div {
          opacity: 1 !important;
          transform: none !important;
        }
        .interfold-header-drop { animation: none !important; }
        .slick-track { display: grid !important; gap: 1.5rem; width: auto !important; transform: none !important; }
        .slick-slide { display: block !important; float: none !important; width: auto !important; opacity: 1 !important; }
        .slick-cloned, .slick-dots { display: none !important; }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
